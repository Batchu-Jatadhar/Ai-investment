name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aitrade
          POSTGRES_PASSWORD: aitrade
          POSTGRES_DB: aitrade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aitrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Migrate (PostgreSQL)
        env:
          DATABASE_URL: postgresql+psycopg://aitrade:aitrade@localhost:5432/aitrade_test
        run: alembic upgrade head

      - name: Verify migration is reversible
        env:
          DATABASE_URL: postgresql+psycopg://aitrade:aitrade@localhost:5432/aitrade_test
        run: |
          alembic downgrade base
          alembic upgrade head

      # The same suite that runs on SQLite locally runs against PostgreSQL here.
      - name: Test (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://aitrade:aitrade@localhost:5432/aitrade_test
        run: pytest -q

      - name: Test (SQLite, the local developer path)
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::a .env file is tracked in git"
            exit 1
          fi
          echo "no tracked .env files"

      - name: Fail on credential-shaped content
        run: |
          # .env.example must contain names only, never values.
          if grep -nE '^(ZERODHA_[A-Z_]+|ANTHROPIC_API_KEY|TRADINGVIEW_WEBHOOK_SECRET)=.+' .env.example; then
            echo "::error::.env.example must declare names with empty values"
            exit 1
          fi
          echo "no populated credential fields in .env.example"

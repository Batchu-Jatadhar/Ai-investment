[project]
name = "aitrade-backend"
version = "0.0.1"
description = "Personal intraday trading decision-support system — backend (Phase 0 foundation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # Zerodha adapter: REST (session, instruments) and the streaming socket.
    # The official kiteconnect package is not used - see docs/architecture.md
    # "Zerodha adapter" for the reasoning (it ships a Twisted reactor that does
    # not belong inside an asyncio service, and we need our own reconnect and
    # gap-accounting semantics anyway).
    "httpx>=0.27",
    "websockets>=13.0",
    # IANA timezone database - Windows has no system tz database.
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
aitrade-marketdata = "app.runtime.market_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query/Path/Depends defaults are the framework's documented style.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]  # dummy credentials in tests are intentional
